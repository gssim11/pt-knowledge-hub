<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신경물리치료·필라테스·뇌과학 학술 지식 허브</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- 상단 글로벌 헤더 -->
  <header class="h-16 border-b border-slate-800 bg-slate-900 px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-lg text-white shadow-md">PT</div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-base text-white tracking-tight">Autonomous Academic Hub</h1>
          <span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium">
            ● 무인 자동 아카이브
          </span>
        </div>
        <p class="text-xs text-slate-400">매일 아침 07:15 PubMed 최신 연구 기반 Gemini 2.0 Flash 심층 학술 브리핑</p>
      </div>
    </div>

    <!-- 통계 배지 및 외부 링크 -->
    <div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-2 text-xs text-slate-400 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
        <span>총 보관 리포트:</span>
        <span id="stat-total-count" class="font-bold text-indigo-400">0</span>건
      </div>
      <a href="https://github.com/gssim11/pt-knowledge-hub" target="_blank" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition flex items-center gap-1.5">
        <span>GitHub 저장소</span>
        <span class="text-[10px] text-slate-400">↗</span>
      </a>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <div class="flex-1 flex overflow-hidden">
    <!-- 좌측 목록 및 필터 바 -->
    <aside class="w-full md:w-[420px] border-r border-slate-800 bg-slate-900/60 flex flex-col shrink-0">
      <!-- 4대 학술 영역 스트림 탭 -->
      <div class="p-2.5 border-b border-slate-800 grid grid-cols-5 gap-1 bg-slate-900">
        <button onclick="setStream('ALL')" data-stream="ALL" class="stream-btn py-2 rounded text-xs font-semibold bg-indigo-600 text-white transition">
          전체 <span id="cnt-ALL" class="opacity-80">0</span>
        </button>
        <button onclick="setStream('NEURO')" data-stream="NEURO" class="stream-btn py-2 rounded text-xs font-medium text-slate-400 hover:bg-slate-800 transition">
          뇌과학 <span id="cnt-NEURO" class="opacity-80">0</span>
        </button>
        <button onclick="setStream('CLINICAL')" data-stream="CLINICAL" class="stream-btn py-2 rounded text-xs font-medium text-slate-400 hover:bg-slate-800 transition">
          임상PT <span id="cnt-CLINICAL" class="opacity-80">0</span>
        </button>
        <button onclick="setStream('PILATES')" data-stream="PILATES" class="stream-btn py-2 rounded text-xs font-medium text-slate-400 hover:bg-slate-800 transition">
          필라테스 <span id="cnt-PILATES" class="opacity-80">0</span>
        </button>
        <button onclick="setStream('POLICY_EBP')" data-stream="POLICY_EBP" class="stream-btn py-2 rounded text-xs font-medium text-slate-400 hover:bg-slate-800 transition">
          정책·EBP <span id="cnt-POLICY_EBP" class="opacity-80">0</span>
        </button>
      </div>

      <!-- 실시간 통합 검색창 -->
      <div class="p-3 border-b border-slate-800">
        <div class="relative">
          <input id="search-input" type="text" oninput="renderList()" placeholder="제목, 생리학 기전, PMID, 키워드 검색..." class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-8 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
          <span class="absolute left-2.5 top-2.5 text-slate-500 text-xs">🔍</span>
        </div>
      </div>

      <!-- 다중 학술 태그 클라우드 -->
      <div class="px-3 py-2 border-b border-slate-800 bg-slate-900/30">
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-[11px] font-semibold text-slate-400">주제별 학술 태그 필터</span>
          <button onclick="clearTags()" class="text-[11px] text-indigo-400 hover:underline">필터 해제</button>
        </div>
        <div id="tag-cloud" class="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto custom-scroll"></div>
      </div>

      <!-- 리포트 카드 목록 -->
      <div id="report-list" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2.5"></div>
    </aside>

    <!-- 우측 뷰어 본문 -->
    <main class="flex-1 flex flex-col bg-slate-950 overflow-hidden">
      <!-- 뷰어 상단 툴바 -->
      <div class="h-14 border-b border-slate-800 bg-slate-900/80 px-5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5 min-w-0">
          <span id="view-badge" class="text-[11px] font-bold px-2 py-0.5 rounded border shrink-0">STREAM</span>
          <h2 id="view-title" class="font-semibold text-sm text-white truncate">리포트를 선택하세요</h2>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <a id="btn-pubmed-link" href="#" target="_blank" class="hidden px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-indigo-300 border border-slate-700 transition">
            📄 PubMed 원문 ↗
          </a>
          <button onclick="openActiveInNewTab()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white shadow transition">
            ↗ 새 창에서 열기
          </button>
        </div>
      </div>

      <!-- 안전 샌드박스 iframe (XSS 및 외부 스크립트 완벽 격리) -->
      <div class="flex-1 bg-white">
        <iframe id="viewer-iframe" class="w-full h-full border-0" sandbox="allow-scripts allow-forms allow-popups"></iframe>
      </div>
    </main>
  </div>

  <script>
    const STREAM_INFO = {
      NEURO: { label: "NEURO · 뇌과학", cls: "bg-purple-500/20 text-purple-300 border-purple-500/30" },
      CLINICAL: { label: "CLINICAL · 임상PT", cls: "bg-sky-500/20 text-sky-300 border-sky-500/30" },
      PILATES: { label: "PILATES · 필라테스", cls: "bg-emerald-500/20 text-emerald-300 border-emerald-500/30" },
      POLICY_EBP: { label: "POLICY · 정책·EBP", cls: "bg-amber-500/20 text-amber-300 border-amber-500/30" }
    };

    let reports = [];
    let currentStream = "ALL";
    let activeTags = new Set();
    let activeId = null;

    async function init() {
      try {
        const res = await fetch('./manifest.json?t=' + Date.now());
        if (res.ok) {
          reports = await res.json();
        }
      } catch (e) {
        console.error("manifest.json 로드 실패:", e);
      }
      refreshUI();
      if (reports.length > 0) selectReport(reports[0].id);
    }

    function refreshUI() {
      document.getElementById('stat-total-count').textContent = reports.length;
      document.getElementById('cnt-ALL').textContent = reports.length;
      Object.keys(STREAM_INFO).forEach(s => {
        document.getElementById(`cnt-${s}`).textContent = reports.filter(r => r.stream === s).length;
      });
      renderTags();
      renderList();
    }

    function setStream(s) {
      currentStream = s;
      document.querySelectorAll('.stream-btn').forEach(b => {
        b.className = b.dataset.stream === s
          ? "stream-btn py-2 rounded text-xs font-semibold bg-indigo-600 text-white transition"
          : "stream-btn py-2 rounded text-xs font-medium text-slate-400 hover:bg-slate-800 transition";
      });
      renderList();
    }

    function renderTags() {
      const counts = {};
      reports.forEach(r => (r.tags || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
      const box = document.getElementById('tag-cloud');
      box.innerHTML = '';
      Object.entries(counts).forEach(([t, c]) => {
        const on = activeTags.has(t);
        const btn = document.createElement('button');
        btn.className = on
          ? "px-2 py-0.5 rounded text-[11px] bg-indigo-600 text-white font-semibold"
          : "px-2 py-0.5 rounded text-[11px] bg-slate-800 text-slate-300 hover:bg-slate-700";
        btn.textContent = `${t} (${c})`;
        btn.onclick = () => { on ? activeTags.delete(t) : activeTags.add(t); refreshUI(); };
        box.appendChild(btn);
      });
    }

    function clearTags() {
      activeTags.clear();
      refreshUI();
    }

    function renderList() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = reports.filter(r => {
        if (currentStream !== 'ALL' && r.stream !== currentStream) return false;
        for (const t of activeTags) if (!(r.tags || []).includes(t)) return false;
        if (q && !`${r.title} ${r.summary} ${r.pmid || ''} ${(r.tags || []).join(' ')}`.toLowerCase().includes(q)) return false;
        return true;
      }).sort((a, b) => b.date.localeCompare(a.date));

      const el = document.getElementById('report-list');
      el.innerHTML = '';
      if (!filtered.length) {
        el.innerHTML = '<div class="text-center py-16 text-xs text-slate-500">일치하는 학술 리포트가 없습니다.</div>';
        return;
      }

      filtered.forEach(r => {
        const info = STREAM_INFO[r.stream] || STREAM_INFO.NEURO;
        const div = document.createElement('div');
        div.className = `p-3.5 rounded-xl border cursor-pointer transition ${r.id === activeId ? 'bg-indigo-950/60 border-indigo-500 shadow-md' : 'bg-slate-900 border-slate-800 hover:border-slate-700'}`;
        div.onclick = () => selectReport(r.id);
        div.innerHTML = `
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${info.cls}">${info.label}</span>
            <span class="text-[11px] text-slate-400 font-mono">${r.date}${r.pmid ? ` · PMID:${r.pmid}` : ''}</span>
          </div>
          <h3 class="text-xs font-semibold text-white mb-1 leading-snug">${r.title}</h3>
          <p class="text-[11px] text-slate-400 line-clamp-2 mb-2 leading-relaxed">${r.summary || ''}</p>
          <div class="flex flex-wrap gap-1">${(r.tags || []).map(t => `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">${t}</span>`).join('')}</div>
        `;
        el.appendChild(div);
      });
    }

    function selectReport(id) {
      const r = reports.find(x => x.id === id);
      if (!r) return;
      activeId = id;
      renderList();

      const info = STREAM_INFO[r.stream] || STREAM_INFO.NEURO;
      const badge = document.getElementById('view-badge');
      badge.textContent = info.label;
      badge.className = `text-[11px] font-bold px-2 py-0.5 rounded border shrink-0 ${info.cls}`;
      document.getElementById('view-title').textContent = r.title;

      const pubmedBtn = document.getElementById('btn-pubmed-link');
      if (r.pmid) {
        pubmedBtn.href = `https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/`;
        pubmedBtn.classList.remove('hidden');
      } else {
        pubmedBtn.classList.add('hidden');
      }

      const frame = document.getElementById('viewer-iframe');
      if (r.path) {
        frame.removeAttribute('srcdoc');
        frame.src = r.path;
      } else {
        frame.srcdoc = r.htmlContent || '<p style="padding:20px;font-family:sans-serif">내용이 비어 있습니다.</p>';
      }
    }

    function openActiveInNewTab() {
      const r = reports.find(x => x.id === activeId);
      if (!r) return;
      if (r.path) {
        window.open(r.path, '_blank');
      } else {
        const blob = new Blob([r.htmlContent], { type: 'text/html;charset=utf-8' });
        window.open(URL.createObjectURL(blob), '_blank');
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
